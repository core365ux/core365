document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"064eaf3c-1f22-4420-b961-92e4a60a2e05\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>/* ============================================================\n   Core365 — Foundations: Color & Type\n   ============================================================\n   Brand color:    #F2691A  (Core365 Orange)\n   Save / accent:  #5A739F  (Steel Blue)\n   Panel header:   #E2E2E2  (Neutral panel)\n   Alert red:      #E7505B\n   Affirm green:   #08A742  (success / done state)\n   Module chrome:  #F6F6F6  (light module background)\n   Hold yellow:    #FCD24A  (intermediate / hold state)\n   Fonts:          Manrope (default/UI), Jost (paragraphs)\n   ------------------------------------------------------------ */\n\n/* Webfonts — local variable TTFs shipped with the design system. */\n@font-face {\n  font-family: 'Manrope';\n  src: url(\"9374a784-d4d5-4b24-baf4-51004eb288eb\") format('truetype-variations'),\n       url(\"9374a784-d4d5-4b24-baf4-51004eb288eb\") format('truetype');\n  font-weight: 200 800;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Jost';\n  src: url(\"ac927e6d-01b8-41b6-8bbb-57079fafe39e\") format('truetype-variations'),\n       url(\"ac927e6d-01b8-41b6-8bbb-57079fafe39e\") format('truetype');\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Jost';\n  src: url(\"1ccc4925-30b3-4e1b-a79e-4028f36ac69c\") format('truetype-variations'),\n       url(\"1ccc4925-30b3-4e1b-a79e-4028f36ac69c\") format('truetype');\n  font-weight: 100 900;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'JetBrains Mono';\n  src: url(\"5a0c3d7d-e5a9-450c-9bbc-f38cc9563559\") format('truetype-variations'),\n       url(\"5a0c3d7d-e5a9-450c-9bbc-f38cc9563559\") format('truetype');\n  font-weight: 100 800;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'JetBrains Mono';\n  src: url(\"91073861-1025-456d-95aa-f7d888a2cf5f\") format('truetype-variations'),\n       url(\"91073861-1025-456d-95aa-f7d888a2cf5f\") format('truetype');\n  font-weight: 100 800;\n  font-style: italic;\n  font-display: swap;\n}\n\n:root {\n  /* ---------- Brand palette ---------- */\n  --c365-orange:        #F2691A;   /* Primary brand */\n  --c365-orange-600:    #D55812;   /* Pressed / hover */\n  --c365-orange-500:    #F2691A;\n  --c365-orange-400:    #F7884A;\n  --c365-orange-300:    #FBAE82;\n  --c365-orange-200:    #FDD3BB;\n  --c365-orange-100:    #FEEAD9;\n  --c365-orange-50:     #FFF5EE;\n\n  --c365-steel:         #5A739F;   /* Save buttons / secondary action */\n  --c365-steel-600:     #485E85;\n  --c365-steel-500:     #5A739F;\n  --c365-steel-400:     #7E94BA;\n  --c365-steel-300:     #A8B8D2;\n  --c365-steel-200:     #CFD8E6;\n  --c365-steel-100:     #E5ECF4;\n  --c365-steel-50:      #F3F6FB;\n\n  /* ---------- Affirmative / hold / module chrome (spec) ---------- */\n  --c365-affirm:        #08A742;   /* Affirmative — completed / approved */\n  --c365-affirm-600:    #07873A;\n  --c365-affirm-bg:     #E1F4E7;\n\n  --c365-hold:          #FCD24A;   /* Intermediate / on hold */\n  --c365-hold-600:      #D9A91A;\n  --c365-hold-fg:       #6B5300;   /* Text-on-yellow */\n  --c365-hold-bg:       #FFF4C7;\n\n  --c365-module:        #F6F6F6;   /* Light module chrome */\n\n  /* ---------- Neutrals ---------- */\n  --c365-ink:           #1F2433;   /* Primary text */\n  --c365-ink-2:         #3A4151;   /* Secondary text */\n  --c365-ink-3:         #6B7384;   /* Tertiary / meta */\n  --c365-ink-4:         #99A0AE;   /* Disabled / placeholder */\n\n  --c365-line:          #D9DDE3;   /* Default border */\n  --c365-line-2:        #E6E9EE;   /* Subtle divider */\n  --c365-panel:         #E2E2E2;   /* Panel header (spec) */\n  --c365-track:         #F6F4F0;   /* Segmented / toggle track (warm) */\n  --c365-surface:       #FFFFFF;   /* Card / sheet */\n  --c365-surface-2:     #F7F8FA;   /* App background tint */\n  --c365-surface-3:     #F1F3F6;   /* Sunken / table stripe */\n  --c365-bg:            #FAFBFC;   /* Page background */\n\n  /* ---------- Semantic ---------- */\n  --c365-success:       #2BA67A;\n  --c365-success-bg:    #E6F5EE;\n  --c365-warning:       #E89B1E;\n  --c365-warning-bg:    #FBEFD4;\n  --c365-danger:        #E7505B;   /* Alert red (spec) */\n  --c365-danger-600:    #C8404A;\n  --c365-danger-bg:     #FCE6E8;\n  --c365-info:          #578FC7;\n  --c365-info-bg:       #E4EEF8;\n\n  /* ---------- Semantic foreground / background tokens ---------- */\n  --fg-1: var(--c365-ink);\n  --fg-2: var(--c365-ink-2);\n  --fg-3: var(--c365-ink-3);\n  --fg-4: var(--c365-ink-4);\n  --fg-on-brand: #FFFFFF;\n\n  --bg-1: var(--c365-surface);\n  --bg-2: var(--c365-surface-2);\n  --bg-3: var(--c365-surface-3);\n  --bg-app: var(--c365-bg);\n\n  --border-1: var(--c365-line);\n  --border-2: var(--c365-line-2);\n\n  --accent: var(--c365-orange);\n  --accent-fg: #FFFFFF;\n  --link: var(--c365-steel-600);\n\n  /* ---------- Typography ---------- */\n  --font-sans:  'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n  --font-body:  'Jost', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n  --font-mono:  'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n\n  /* Type scale — UI-density first */\n  --fs-12: 12px;   --lh-12: 16px;\n  --fs-13: 13px;   --lh-13: 18px;\n  --fs-14: 14px;   --lh-14: 20px;\n  --fs-16: 16px;   --lh-16: 24px;\n  --fs-18: 18px;   --lh-18: 26px;\n  --fs-20: 20px;   --lh-20: 28px;\n  --fs-24: 24px;   --lh-24: 32px;\n  --fs-30: 30px;   --lh-30: 38px;\n  --fs-36: 36px;   --lh-36: 44px;\n  --fs-48: 48px;   --lh-48: 56px;\n  --fs-60: 60px;   --lh-60: 68px;\n\n  --fw-light: 300;      /* @kind font */\n  --fw-regular: 400;    /* @kind font */\n  - px; height: 17px; color: #F2691A;\"><\u002Fi><\u002Fdiv>\n        <div style=\"min-width: 0;\"><div style=\"font-size: 14.5px; font-weight: 700; color: #F4F5F7;\">Pick up where you left off<\u002Fdiv><div style=\"font-family: 'Jost', sans-serif; font-size: 13px; line-height: 1.35; color: #8A8E99;\">Access your workflows, projects, tasks, and team activity from one secure workspace.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"{{ featCardStyle }}\">\n        <div style=\"flex: none; width: 34px; height: 34px; border-radius: 9px; background: rgba(242,105,26,0.14); display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"bell-ring\" style=\"width: 17px; height: 17px; color: #F2691A;\"><\u002Fi><\u002Fdiv>\n        <div style=\"min-width: 0;\"><div style=\"font-size: 14.5px; font-weight: 700; color: #F4F5F7;\">Stay current on what needs attention<\u002Fdiv><div style=\"font-family: 'Jost', sans-serif; font-size: 13px; line-height: 1.35; color: #8A8E99;\">Review approvals, documents, project updates, service items, and exceptions.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"{{ featCardStyle }}\">\n        <div style=\"flex: none; width: 34px; height: 34px; border-radius: 9px; background: rgba(242,105,26,0.14); display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"activity\" style=\"width: 17px; height: 17px; color: #F2691A;\"><\u002Fi><\u002Fdiv>\n        <div style=\"min-width: 0;\"><div style=\"font-size: 14.5px; font-weight: 700; color: #F4F5F7;\">Keep the operation moving<\u002Fdiv><div style=\"font-family: 'Jost', sans-serif; font-size: 13px; line-height: 1.35; color: #8A8E99;\">Use dashboards and notifications to see what is pending, completed, or overdue.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- quick access modules -->\n    <sc-if value=\"{{ showModules }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"{{ modulesStyle }}\">\n a(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); font-size: 12px; font-weight: 600; color: #B7BBC4; white-space: nowrap;\">Finance<\u002Fspan><span style=\"padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); font-size: 12px; font-weight: 600; color: #B7BBC4; white-space: nowrap;\">Funding<\u002Fspan><span style=\"padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); font-size: 12px; font-weight: 600; color: #B7BBC4; white-space: nowrap;\">Lender<\u002Fspan><span style=\"padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); font-size: 12px; font-weight: 600; color: #B7BBC4; white-space: nowrap;\">Commissions<\u002Fspan><span style=\"padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); font-size: 12px; font-weight: 600; color: #B7BBC4; white-space: nowrap;\">TPS<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 13.5px; font-weight: 700; color: #E8E9EC; margin-bottom: 8px;\">Workflows &amp; Data<\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\"><span style=\"padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); font-size: 12px; font-weight: 600; color: #B7BBC4; white-space: nowrap;\">Analytics<\u002Fspan><span style=\"padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); font-size: 12px; font-weight: 600; color: #B7BBC4; white-space: nowrap;\">Forms<\u002Fspan><span style=\"padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); font-size: 12px; font-weight: 600; color: #B7BBC4; white-space: nowrap;\">Integrations<\u002Fspan><span style ign-items: center; gap: 9px; cursor: pointer; font-size: 14px; color: #3A4151;\">\n          <input type=\"checkbox\" style=\"width: 16px; height: 16px; accent-color: #F2691A; cursor: pointer;\">\n          <span>Remember me<\u002Fspan>\n        <\u002Flabel>\n        <a href=\"#\" style=\"font-size: 14px; font-weight: 600; color: #F2691A; text-decoration: none;\">Forgot your password?<\u002Fa>\n      <\u002Fdiv>\n\n      <button style=\"width: 100%; height: 50px; margin-top: 24px; border: none; border-radius: 8px; background: #F2691A; color: #fff; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;\" style-hover=\"background: #D55812;\">Log in <i data-lucide=\"arrow-right\" style=\"width: 18px; height: 18px;\"><\u002Fi><\u002Fbutton>\n\n      <div style=\"margin-top: 26px; text-align: center; font-size: 13px; color: #6B7384;\">© 2026 Core365.io &nbsp;·&nbsp; <a href=\"#\" style=\"color:#6B7384; text-decoration:none;\">Privacy<\u002Fa> &nbsp;·&nbsp; <a href=\"#\" style=\"color:#6B7384; text-decoration:none;\">Terms<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; font-size: 16px; z-index: 1;\">\n      <span>🇺🇸<\u002Fspan><span>🇨🇦<\u002Fspan><span>🇪🇸<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 910}, &quot;view&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Desktop 1920×910&quot;, &quot;Tablet Landscape&quot;, &quot;Tablet Portrait&quot;, &quot;Mobile&quot;], &quot;default&quot;: &quot;Desktop 1920×910&quot;, &quot;tsType&quot;: &quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { showPw: false };\n  componentDidMount() { this.renderIcons(); }\n  componentDidUpdate() { this.renderIcons(); }\n  renderIcons() {\n    if (window.lucide) {\n      window.lucide.createIcons();\n    } else {\n      let tries = 0;\n      const t = setInterval(() => {\n        if (window.lucide) { window.lucide.createIcons(); clearInterval(t); }\n        else if (++tries > 100) clearInterval(t);\n      }, 50);\n    }\n    const el = document.getElementById('c365-help-email');\n    if (el && !el.textContent) el.textContent = 'helpdesk' + String.fromCharCode(64) + 'core365.io';\n  }\n  renderVals() {\n    const view = this.props.view || 'Desktop 1920×910';\n    const desktop = view === 'Desktop 1920×910';\n    const tabletL = view === 'Tablet Landscape';\n    const tabletP = view === 'Tablet Portrait';\n    const mobile = view === 'Mobile';\n    const isRow = desktop || tabletL;\n    const dims = {\n      'Desktop 1920×910': { w: 1920, h: 910 },\n      'Tablet Landscape': { w: 1024, h: 768 },\n      'Tablet Portrait': { w: 834, h: 1112 },\n      'Mobile': { w: 402, h: 874 },\n    }[view];\n\n    const rootStyle = {\n      width: dims.w + 'px', height: dims.h + 'px', margin: '0 auto',\n      display: 'flex', flexDirection: isRow ? 'row' : 'column',\n      overflow: 'hidden', fontFamily: \"'Manrope', sans-serif\", background: '#ffffff',\n    };\n\n    const asideStyle = {\n      position: 'relative',\n      width: desktop ? '720px' : (tabletL ? '384px' : '100%'),\n      height: isRow ? dims.h + 'px' : 'auto',\n      flex: 'none', overflow: 'hidden',\n      background: 'linear-gradient(rgba(13,14,18,0.9), rgba(13,14,18,0.9)), #0d0e12 url(assets/bg-dark.webp) center / cover no-repeat',\n      backgroundBlendMode: 'normal',\n      display: 'flex', flexDirection: 'column',\n      justifyContent: desktop ? 'space-between' : 'flex-start',\n      padding: desktop ? '40px 56px 34px'\n        : tabletL ? '40px 40px 28px'\n        : tabletP ? '44px 56px 40px'\n        : '24px 24px 24px',\n    };\n\n    const headlineStyle = {\n      margin: '0',\n      fontSize: desktop ? '36px' : tabletP ? '36px' : tabletL ? '30px' : '26px',\n      lineHeight: 1.05, fontWeight: 800, letterSpacing: '-0.025em',\n      color: '#ffffff', whiteSpace: desktop ? 'nowrap' : 'normal',\n    };\n\n    const padTop = desktop ? 40 : tabletL ? 40 : 44;\n    const padRight = tabletL ? 40 : 56;\n    const badgeStyle = {\n      position: 'absolute', zIndex: 2,\n      top: (padTop + 13) + 'px', right: padRight + 'px',\n      display: 'inline-flex', alignItems: 'center', gap: '7px',\n      padding: '6px 13px', border: '1px solid rgba(255,255,255,0.12)',\n      borderRadius: '999px', background: 'rgba(255,255,255,0.03)',\n    };\n\n    // On desktop the aside uses space-between to distribute slack evenly,\n    // so section top-margins are zeroed; other (column) views keep explicit margins.\n    const headBlockStyle = {\n      position: 'relative', zIndex: 1, marginTop: desktop ? '0' : '28px',\n    };\n    const subtitleStyle = {\n      margin: desktop ? '14px 0 0' : '14px 0 0', maxWidth: '480px',\n      fontFamily: \"'Jost', sans-serif\", fontSize: '16px',\n      lineHeight: 1.55, color: '#9CA0AB',\n    };\n    const featuresStyle = {\n      position: 'relative', zIndex: 1, marginTop: desktop ? '0' : '24px',\n      display: 'flex', flexDirection: 'column', gap: '12px',\n    };\n    const featCardStyle = {\n      display: 'flex', alignItems: 'center', gap: '14px',\n      padding: '13px 16px',\n      border: '1px solid rgba(255,255,255,0.07)', borderRadius: '12px',\n      background: 'rgba(255,255,255,0.025)',\n    };\n    const modulesStyle = {\n      position: 'relative', zIndex: 1, marginTop: desktop ? '0' : '22px',\n      padding: '16px 18px 18px',\n      border: '1px solid rgba(255,255,255,0.07)', borderRadius: '14px',\n      background: 'rgba(255,255,255,0.02)',\n    };\n    const modHeaderStyle = {\n      display: 'flex', alignItems: 'center', gap: '8px',\n      marginBottom: '14px',\n    };\n    const complianceStyle = {\n      marginTop: '14px
