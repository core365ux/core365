  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ate<\u002Fspan>\n              {{ stateSummary }}\n            <\u002Fspan>\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:var(--fg-3);flex-shrink:0\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fbutton>\n          <sc-if value=\"{{ stateDropOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div onclick=\"{{ closeStateDrop }}\" style=\"position:fixed;inset:0;z-index:40\"><\u002Fdiv>\n            <div style=\"position:absolute;top:100%;left:14px;right:14px;margin-top:-4px;z-index:50;background:var(--bg-1);border:1px solid var(--border-1);border-radius:var(--r-md);box-shadow:var(--shadow-3);display:flex;flex-direction:column;overflow:hidden\">\n              <div style=\"padding:8px;border-bottom:1px solid var(--border-2)\">\n                <input type=\"text\" value=\"{{ stateSearch }}\" onchange=\"{{ onStateSearch }}\" placeholder=\"Search states\" style=\"width:100%;box-sizing:border-box;font-family:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--border-1);border-radius:var(--r-sm);color:var(--fg-1);outline:none\" style-focus=\"border-color:var(--c365-steel-400)\">\n              <\u002Fdiv>\n              <label style=\"display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid var(--border-2);cursor:pointer;background:var(--bg-2)\">\n                <input type=\"checkbox\" checked=\"{{ allStatesChecked }}\" onchange=\"{{ allStatesToggle }}\" ref=\"{{ allStatesRef }}\" style=\"width:14px;height:14px;accent-color:var(--c365-steel);cursor:pointer;margin:0;flex-shrink:0\">\n                <span style=\"font-size:12px;font-weight:600;color:var(--fg-2)\">All states<\u002Fspan>\n              <\u002Flabel>\n              <div style=\"max-height:216px;overflow-y:auto;padding:4px;display:flex;flex-direction:column\">\n                <sc-for list=\"{{ stateItems }}\" as=\"si\" hint-placeholder-count=\"8\">\n                  <label style=\"display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:var(--r-xs);cursor:pointer\" style-hover=\"background:var(--bg-3)\">\n                    <input type=\"checkbox\" checked=\"{{ si.checked }}\" onchange=\"{{ si.onToggle }}\" style=\"width:14px;height:14px;accent-color:var(--c365-steel);cursor:pointer;margin:0;flex-shrink:0\">\n                    <span style=\"font-size:12px;font-weight:700;color:var(--fg-1);width:24px;flex-shrink:0\">{{ si.code }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:var(--fg-3)\">{{ si.name }}<\u002Fspan>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"padding:10px;display:flex;flex-direction:column;gap:6px\">\n          <label style=\"display:flex;align-items:center;gap:10px;cursor:pointer;background:#EEF0F3;border-radius:var(--r-sm);padding:8px 12px\">\n            <input type=\"checkbox\" checked=\"{{ allChecked }}\" onchange=\"{{ allMasterToggle }}\" ref=\"{{ allMasterRef }}\" style=\"width:16px;height:16px;accent-color:var(--c365-steel);cursor:pointer;margin:0;flex-shrink:0\">\n            <span style=\"font-family:inherit;font-size:13px;font-weight:600;color:var(--fg-1)\">All Appointment Types<\u002Fspan>\n          <\u002Flabel>\n          <sc-for list=\"{{ typesA }}\" as=\"t\" hint-placeholder-count=\"9\">\n            <div style=\"display:flex;flex-direction:column\">\n              <div onclick=\"{{ t.headerClick }}\" style=\"display:flex;align-items:center;gap:10px;background:#EEF0F3;border-radius:var(--r-sm);padding:8px 12px;cursor:pointer\">\n                <input type=\"checkbox\" checked=\"{{ t.checked }}\" onchange=\"{{ t.onToggle }}\" onclick=\"{{ t.stopProp }}\" ref=\"{{ t.checkRef }}\" style=\"width:16px;height:16px;accent-color:var(--c365-steel);cursor:pointer;margin:0;flex-shrink:0\">\n                <span style=\"width:12px;height:12px;border-radius:50%;background:{{ t.color }};flex-shrink:0\"><\u002Fspan>\n                <span style=\"flex:1;font-size:13px;font-weight:600;color:var(--fg-1)\">{{ t.name }} <span style=\"font-weight:500;color:var(--fg-3)\">({{ t.count }})<\u002Fspan><\u002Fspan>\n                <sc-if value=\"{{ t.hasChildren }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button onclick=\"{{ t.chevronClick }}\" style=\"display:flex;align-items:center;justify-content:center;width:22px;height:22px;background:none;border:none;cursor:pointer;color:var(--fg-2);border-radius:4px\" style-hover=\"background:rgba(20,28,51,0.08)\">\n                    <sc-if value=\"{{ t.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"18 15 12 9 6 15\"><\u002Fpolyline><\u002Fsvg>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ t.collapsed }}\" hint-placeholder-val=\"{{ true }}\">\n                      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n                    <\u002Fsc-if>\n                  <\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ t.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;padding:4px 0 6px 30px;gap:1px\">\n                  <sc-for list=\"{{ t.children }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <div onclick=\"{{ c.onToggle }}\" style=\"display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:var(--r-xs);cursor:pointer\" style-hover=\"background:var(--bg-3)\">\n                      <input type=\"checkbox\" checked=\"{{ c.checked }}\" onchange=\"{{ c.onToggle }}\" onclick=\"{{ c.stopProp }}\" style=\"width:14px;height:14px;accent-color:var(--c365-steel);cursor:pointer;margin:0;flex-shrink:0\">\n                      <span style=\"flex:1;font-size:12.5px;color:var(--fg-2)\">{{ c.name }}<\u002Fspan>\n                      <sc-if value=\"{{ showCounts }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span style=\"font-size:11.5px;color:var(--fg-3);font-variant-numeric:tabular-nums\">{{ c.count }}<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1300, &quot;height&quot;: 1100 },\n  &quot;statusPlacement&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;options&quot;: [&quot;mixed&quot;, &quot;dropdown&quot;, &quot;segmented&quot;],\n    &quot;default&quot;: &quot;mixed&quot;,\n    &quot;tsType&quot;: &quot;'mixed'|'dropdown'|'segmented'&quot;,\n    &quot;section&quot;: &quot;Status filter&quot;,\n    &quot;description&quot;: &quot;Status control style: dropdown (like today), segmented buttons, or mixed (1b shows segmented)&quot;\n  },\n  &quot;showCounts&quot;: {\n    &quot;editor&quot;: &quot;boolean&quot;,\n    &quot;default&quot;: true,\n    &quot;tsType&quot;: &quot;boolean&quot;,\n    &quot;section&quot;: &quot;List&quot;,\n    &quot;description&quot;: &quot;Show appointment counts on sub-categories&quot;\n  }\n}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.STATES = ['AZ', 'CA', 'NV', 'TX'];\n    this.US_STATES = [\n      ['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],\n      ['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],['FL','Florida'],['GA','Georgia'],\n      ['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],['IN','Indiana'],['IA','Iowa'],\n      ['KS','Kansas'],['KY','Kentucky'],['LA','Louisiana'],['ME','Maine'],['MD','Maryland'],\n      ['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],['MS','Mississippi'],['MO','Missouri'],\n      ['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],['NH','New Hampshire'],['NJ','New Jersey'],\n      ['NM','New Mexico'],['NY','New York'],['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],\n      ['OK','Oklahoma'],['OR','Oregon'],['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],\n      ['SD','South Dakota'],['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],\n      ['VA','Virginia'],['WA','Washington'],['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming']\n    ];\n    this.TYPES = [\n      { id: 'ewos', name: 'EWOS', color: '#9B1B30', count: 0 },\n      { id: 'inspection', name: 'Inspection', color: '#D64545', count: 6 },\n      { id: 'installation', name: 'Installation', color: '#8FC7E8', children: [\n        { id: 'elec-battery', name: 'Electrical (Battery)', count: 8 },\n        { id: 'finish', name: 'Finish (Panel Lay)', count: 11 },\n        { id: 'full', name: 'Full', count: 17 },\n        { id: 'roof-battery', name: 'Roof Work (Battery)', count: 6 },\n        { id: 'tie-in', name: 'Tie In', count: 7 }\n      ] },\n      { id: 'mpu', name: 'MPU', color: '#F2691A', count: 5 },\n      { id: 'service', name: 'Service', color: '#1F3A5F', children: [\n        { id: 'battery', name: 'Battery', count: 4 },\n        { id: 'comm', name: 'Commissioning/Activation', count: 3 },\n        { id: 'critter', name: 'Critter Guard', count: 2 },\n        { id: 'disconnect', name: 'Disconnect', count: 1 },\n        { id: 'el-breaker', name: 'Electrical - Breaker', count: 3 },\n        { id: 'el-equip', name: 'Electrical - Equipment', count: 4 },\n        { id: 'el-ground', name: 'Electrical - Grounding', count: 2 },\n        { id: 'trash', name: 'Equipment/Trash Collection', count: 1 },\n        { id: 'gateway', name: 'Gateway and Subpanel', count: 2 },\n        { id: 'portal', name: 'Monitoring Portal/App Support', count: 3 },\n        { id: 'photos', name: 'Photos', count: 2 },\n        { id: 'drywall', name: 'Repair - Drywall', count: 2 },\n        { id: 'home-dmg', name: 'Repair - Home Damage', count: 3 }\n      ] },\n      { id: 'svc-activation', name: 'Service - Activation', color: '#E060A6', count: 0 },\n      { id: 'site-survey', name: 'Site Survey', color: '#8A8F98', count: 56 },\n      { id: 'time-off', name: 'Time Off', color: '#E7505B', count: 3 },\n      { id: 'training', name: 'Training', color: '#43A047', count: 0 }\n    ];\n    const sel = {};\n    this.TYPES.forEach(t => {\n      if (t.children) t.children.forEach(c => { sel[t.id + '/' + c.id] = true; });\n      else sel[t.id] = true;\n    });\n    this.state = {\n      sel,\n      states: { AZ: true, CA: true, NV: true, TX: true },\n      stateDropOpen: false,\n      stateSearch: '',\n      status: 'all',\n      expanded: { 'a-installation': true, 'b-installation': true, 'b-service': true, 'c-installation': true, 'c-service': true },\n      mDrawerOpen: false,\n      mStateExpanded: false,\n      mStateSearch: '',\n      mStatus: 'open',\n      mStates: { CA: true, TX: true },\n      mExpanded: { installation: true, service: false },\n      mSel: (() => {\n        const o = {};\n        this.TYPES.forEach(t => {\n          if (t.children) t.children.forEach(c => { o[t.id + '/' + c.id] = true; });\n          else o[t.id] = true;\n        });\n        o['ewos'] = false;\n        return o;\n      })()\n    };\n  }\n\n  renderVals() {\n    const { sel, states, status, expanded } = this.state;\n    const showCounts = this.props.showCounts ?? t
