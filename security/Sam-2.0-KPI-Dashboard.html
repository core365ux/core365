<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sam 2.0 — KPI Dashboard</title>
<style>
  :root{
    --bg:#f9f9fa; --card:#ffffff; --line:#dcdce0; --line2:#ececed;
    --ink:#3b3c3e; --ink2:#5f636a; --ink3:#9a9da3;
    --orange:#23ade8; --orange-soft:#e8f7fd; --orange-line:#a9e0f5;
    --cyan:#4dbdec; --cyan-deep:#1593c9;
    --blue:#4b50ec; --blue-soft:#ecedfd;
    --green:#1fb87f; --green-soft:#e4f8f1; --green-deep:#0e8e62;
    --amber:#c98a16; --amber-soft:#fbf1dc;
    --red:#e0584a; --red-soft:#fcebe9;
    --accent-orange:#ec7b4b;
    --slate:#5f636a;
    --shadow:0 1px 2px rgba(59,60,62,.06), 0 1px 3px rgba(59,60,62,.05);
    --shadow-lg:0 20px 50px rgba(40,45,55,.20);
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"SF Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1480px;margin:0 auto;padding:0 22px 40px}

  /* ---------- Top bar ---------- */
  .topbar{display:flex;align-items:center;gap:16px;padding:18px 4px 16px}
  .topbar .title{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
  .topbar .title small{display:block;font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--ink3);margin-top:2px;text-transform:none}
  .topbar .sample{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--ink3);background:#ececed;border:1px solid var(--line);padding:3px 8px;border-radius:6px}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .iconbtn{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;display:grid;place-items:center;color:var(--ink2);cursor:pointer}
  .iconbtn:hover{background:#f4f6f8}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
  .who{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--ink2);font-size:12.5px}

  /* ---------- Controls row ---------- */
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:none;background:#fff;color:var(--ink2);font-family:inherit;font-size:12px;font-weight:600;padding:8px 13px;cursor:pointer;border-right:1px solid var(--line2)}
  .seg button:last-child{border-right:none}
  .seg button.active{background:var(--orange);color:#fff;font-weight:700}
  .seg button:hover:not(.active){background:#f4f6f8}
  select.ctl{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 30px 0 12px;font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;font-family:inherit;-webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 3.5L5 6.5L8 3.5' stroke='%238a93a6' fill='none' stroke-width='1.4'/></svg>");background-repeat:no-repeat;background-position:right 11px center}
  .ctl-lab{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;margin-right:-4px}
  .spacer{flex:1}
  .btn{height:36px;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:700;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:#f4f6f8}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
  .btn.primary:hover{filter:brightness(.97)}
  .custom-range{display:none;align-items:center;gap:6px}
  .custom-range.show{display:inline-flex}
  .custom-range input{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-family:inherit;font-size:12px;color:var(--ink)}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:14px}
  .section-h{display:flex;align-items:center;gap:9px;margin:22px 2px 12px}
  .section-h h2{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:0}
  .section-h .hint{font-size:11px;color:var(--ink3)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
  .card h3{margin:0 0 2px;font-size:13px;font-weight:700;color:var(--ink)}
  .card .csub{font-size:11px;color:var(--ink3);margin-bottom:14px}

  /* stat tiles */
  .stat-row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px}
  .stat .sl{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:700}
  .stat .sv{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.5px;line-height:1.1;margin-top:5px}
  .stat .sv.accent{color:var(--orange)}
  .stat .sd{font-size:11px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:4px}
  .sd.up{color:var(--green-deep)} .sd.down{color:var(--red)}
  .stat .spark{margin-top:6px}

  @media (max-width:1200px){ .stat-row{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:680px){ .stat-row{grid-template-columns:repeat(2,1fr)} }

  /* two/three column card layouts */
  .cols-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cols-3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}
  @media (max-width:980px){ .cols-2,.cols-3{grid-template-columns:1fr} }

  /* mini table */
  .ktab{width:100%;border-collapse:collapse}
  .ktab th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  .ktab th.num{text-align:right}
  .ktab th .ar{opacity:.4;font-size:9px;margin-left:3px}
  .ktab th.sorted .ar{opacity:1;color:var(--orange)}
  .ktab td{padding:9px 10px;border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--ink2)}
  .ktab td.num{text-align:right;font-variant-numeric:tabular-nums}
  .ktab td.rep{font-weight:700;color:var(--ink)}
  .ktab tr:hover td{background:#fafbfc}
  .ktab tr.top td{background:var(--orange-soft)}
  .ktab tr.top td.rep::after{content:"TOP";font-size:8px;font-weight:800;color:var(--orange);background:#fff;border:1px solid var(--orange-line);border-radius:4px;padding:1px 4px;margin-left:7px;vertical-align:middle}
  .ktab tfoot td{border-top:2px solid var(--line);border-bottom:none;font-weight:800;color:var(--ink);padding-top:10px}
  .ktab tfoot td.num{color:var(--ink)}
  /* grouped origination vs closing columns */
  .ktab .grp-row th{padding:6px 10px;border-bottom:none}
  .ktab th.grp{text-align:center;font-size:9.5px;letter-spacing:.06em;border-radius:6px 6px 0 0}
  .ktab th.grp-o{color:var(--blue);background:var(--blue-soft)}
  .ktab th.grp-c{color:var(--green-deep);background:var(--green-soft)}
  .ktab td.col-o, .ktab th.col-o{background:rgba(75,80,236,.035)}
  .ktab td.col-c, .ktab th.col-c{background:rgba(31,184,127,.04)}
  .ktab tr.top td.col-o{background:rgba(75,80,236,.09)}
  .ktab tr.top td.col-c{background:rgba(31,184,127,.10)}
  .ktab tr:hover td.col-o{background:rgba(75,80,236,.07)}
  .ktab tr:hover td.col-c{background:rgba(31,184,127,.08)}
  .tsearch{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 11px;font-family:inherit;font-size:12px;color:var(--ink);width:200px}

  /* lead source rows */
  .ls-row{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
  .ls-row:first-child{border-top:none}
  .ls-name{font-weight:700;color:var(--ink);font-size:12.5px;display:flex;align-items:center;gap:8px}
  .ls-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .ls-val{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink2)}
  .ls-val b{color:var(--ink);font-weight:700}
  .ls-bar{height:5px;background:#eef0f3;border-radius:3px;overflow:hidden;margin-top:4px}
  .ls-bar i{display:block;height:100%;background:var(--orange);border-radius:3px}
  .ls-head{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:10px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .ls-head span:not(:first-child){text-align:right}

  /* funnel */
  .funnel{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .fn-stage{position:relative}
  .fn-bar{height:46px;border-radius:9px;display:flex;align-items:center;padding:0 16px;color:#fff;font-weight:700}
  .fn-bar .fl{font-size:12px;opacity:.92;font-weight:600}
  .fn-bar .fv{font-size:19px;margin-left:auto;font-weight:800}
  .fn-conv{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);padding:5px 4px 0}
  .fn-conv b{color:var(--orange);font-weight:800}

  /* goal ring + bars */
  .goal-wrap{display:flex;gap:20px;align-items:center}
  .goal-stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .goal-mini .gl{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:700}
  .goal-mini .gv{font-size:20px;font-weight:800;color:var(--ink);margin-top:2px}
  .goal-mini .gv.accent{color:var(--orange)} .goal-mini .gv.green{color:var(--green-deep)}

  /* credit */
  .credit-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cr-mini{padding:11px 0;border-top:1px solid var(--line2)}
  .cr-mini:first-child{border-top:none}
  .cr-mini .cl{font-size:11px;color:var(--ink3);font-weight:600}
  .cr-mini .cv{font-size:16px;font-weight:800;color:var(--ink)}

  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .tbl-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== TOP BAR ===== -->
  <div class="topbar">
    <div class="title">Inside Sales · KPI Dashboard <small>Performance, productivity &amp; goal attainment</small></div>
    <span class="sample">SAMPLE DATA</span>
    <div class="right">
      <button class="iconbtn" title="Refresh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button>
      <div class="who"><span class="avatar">JO</span> Jacob Olson</div>
    </div>
  </div>

  <!-- ===== CONTROLS ===== -->
  <div class="controls">
    <div class="seg" id="periodSeg">
      <button data-p="today">Today</button>
      <button data-p="yesterday">Yesterday</button>
      <button data-p="week" class="active">This Week</button>
      <button data-p="lastweek">Last Week</button>
      <button data-p="mtd">Month to Date</button>
      <button data-p="lastmonth">Last Month</button>
      <button data-p="custom">Custom</button>
    </div>
    <div class="custom-range" id="customRange">
      <input type="date" id="cFrom"><span style="color:var(--ink3)">–</span><input type="date" id="cTo">
    </div>
    <div class="seg" id="viewSeg" style="margin-left:12px" title="Which sales role the summary reflects">
      <button data-v="opener">Opened By</button>
      <button data-v="closer" class="active">Closer</button>
    </div>
    <div class="spacer"></div>
    <span class="ctl-lab">Rep</span>
    <select class="ctl" id="fRep" onchange="applyFilters()"><option value="">All Reps</option></select>
    <span class="ctl-lab">Team</span>
    <select class="ctl" id="fTeam" onchange="applyFilters()"><option value="">All Teams</option><option>Team Alpha</option><option>Team Bravo</option></select>
    <span class="ctl-lab">Office</span>
    <select class="ctl" id="fOffice" onchange="applyFilters()"><option value="">All Offices</option><option>Salt Lake City</option><option>Phoenix</option><option>Dallas</option></select>
    <span class="ctl-lab">Source</span>
    <select class="ctl" id="fSource" onchange="applyFilters()"><option value="">All Sources</option></select>
    <button class="btn" onclick="exportCSV()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Export</button>
  </div>

  <!-- sections injected here -->
  <div id="dash"></div>

</div>

<script>
/* ===== Seeded data model — two roles per rep ===== */
const REPS=[
  {name:"A. Reyes",   team:"Team Alpha", office:"Salt Lake City"},
  {name:"M. Cole",    team:"Team Alpha", office:"Phoenix"},
  {name:"S. Pham",    team:"Team Bravo", office:"Salt Lake City"},
  {name:"T. Banks",   team:"Team Bravo", office:"Dallas"},
  {name:"J. Olson",   team:"Team Alpha", office:"Phoenix"},
  {name:"D. Nguyen",  team:"Team Bravo", office:"Dallas"},
];
const SOURCES=["Aloha","Infotech","Website","Referral","Reactivation"];

// deterministic pseudo-random so numbers are stable per period+rep
function seed(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0)/4294967295; }
const PERIOD_MULT={today:1, yesterday:1, week:5, lastweek:5, mtd:18, lastmonth:30, custom:12};
const PERIOD_LABEL={today:"Today", yesterday:"Yesterday", week:"This Week", lastweek:"Last Week", mtd:"Month to Date", lastmonth:"Last Month", custom:"Custom Range"};

let state={ period:"week", rep:"", team:"", office:"", source:"", view:"closer" };

/*
  Two distinct metric streams per rep:
  - ORIGINATION (earned by the Opened By rep): calls, creditsRan, b2bFail, leads, accounts, leadConv
  - CLOSING (earned by the Closer): docusignSent, signed, firstPay, readyToPublish, installs, revenue, rmr, closingPct
  A handoff fraction of each opener's created accounts is closed by a DIFFERENT rep, so an opener's
  origination volume will not match their own closing volume — exactly the split the manager must see.
*/
function originationFor(rep, period){
  const m=PERIOD_MULT[period]||1;
  const b=seed(rep.name+period+"orig");
  const callsPerDay=14+Math.round(b*22);
  const calls=Math.round(callsPerDay*m);
  const leadConv=0.16+seed(rep.name+"lc")*0.20;       // lead→account rate (origination quality)
  const accounts=Math.round(calls*leadConv);
  const leads=Math.round(calls*(0.7+seed(rep.name+"ld")*0.25));
  const creditsRan=Math.round(calls*(0.6+seed(rep.name+"cr")*0.3));
  const b2bFail=Math.round(creditsRan*(0.08+seed(rep.name+"b")*0.12));
  return {calls, accounts, leads, creditsRan, b2bFail, leadConv};
}
// how a rep's originated accounts get distributed to closers (some kept, some handed off)
function closingFor(rep, period){
  // a closer receives accounts: their own kept + handoffs in from others
  const m=PERIOD_MULT[period]||1;
  // start from accounts this rep PERSONALLY originated and kept
  const own=originationFor(rep,period).accounts;
  const keepFrac=0.55+seed(rep.name+"keep")*0.30;     // 55-85% of own accounts they also close
  let received=Math.round(own*keepFrac);
  // plus handoffs received from other reps (deterministic routing)
  REPS.forEach(other=>{
    if(other.name===rep.name) return;
    const oacc=originationFor(other,period).accounts;
    const handoff=oacc*(1-(0.55+seed(other.name+"keep")*0.30)); // what 'other' did NOT keep
    // route a share of other's handoffs to this rep
    const share=seed(other.name+rep.name+"route");
    received += Math.round(handoff*share*0.5);
  });
  const closeRate=0.62+seed(rep.name+"close")*0.28;   // account→sale (closing skill)
  const sales=Math.round(received*closeRate);
  const installs=Math.round(sales*(0.80+seed(rep.name+"inst")*0.15));
  const docusignSent=Math.round(received*(0.9+seed(rep.name+"ds")*0.1));
  const signed=sales;
  const firstPay=Math.round(sales*(0.92+seed(rep.name+"fp")*0.08));
  const rmr=sales*(44.99+Math.round(seed(rep.name+"r")*20));
  const revenue=installs*(150+Math.round(seed(rep.name+"rev")*60));
  return {accountsReceived:received, sales, installs, docusignSent, signed, firstPay, rmr, revenue, closeRate};
}

// unified per-rep record carrying BOTH role streams + the active-view convenience fields
function repMetrics(rep, period){
  const o=originationFor(rep,period);
  const c=closingFor(rep,period);
  return {
    name:rep.name, team:rep.team, office:rep.office,
    // origination (Opened By)
    calls:o.calls, accounts:o.accounts, leads:o.leads, creditsRan:o.creditsRan, b2bFail:o.b2bFail, leadConv:o.leadConv,
    // closing (Closer)
    accountsReceived:c.accountsReceived, sales:c.sales, installs:c.installs, docusignSent:c.docusignSent,
    signed:c.signed, firstPay:c.firstPay, rmr:c.rmr, revenue:c.revenue, closeRate:c.closeRate,
    // convenience: conversion shown depends on role view
    conv:(c.sales/Math.max(1,o.calls)),     // overall call→sale (blended)
    util:0.55+seed(rep.name+"u")*0.4,
  };
}

function activeReps(){
  return REPS.filter(r=>
    (!state.rep||r.name===state.rep) &&
    (!state.team||r.team===state.team) &&
    (!state.office||r.office===state.office)
  );
}
function allMetrics(){ return activeReps().map(r=>repMetrics(r,state.period)); }

/* ===== controls wiring ===== */
document.getElementById('periodSeg').addEventListener('click',e=>{
  const btn=e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#periodSeg button').forEach(b=>b.classList.toggle('active',b===btn));
  state.period=btn.dataset.p;
  document.getElementById('customRange').classList.toggle('show',state.period==='custom');
  renderDash();
});
document.getElementById('viewSeg').addEventListener('click',e=>{
  const btn=e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('active',b===btn));
  state.view=btn.dataset.v;
  renderDash();
});
function applyFilters(){
  state.rep=document.getElementById('fRep').value;
  state.team=document.getElementById('fTeam').value;
  state.office=document.getElementById('fOffice').value;
  state.source=document.getElementById('fSource').value;
  renderDash();
}
// populate rep + source filter options
(function(){
  const rs=document.getElementById('fRep'); REPS.forEach(r=>{const o=document.createElement('option');o.textContent=r.name;rs.appendChild(o);});
  const ss=document.getElementById('fSource'); SOURCES.forEach(s=>{const o=document.createElement('option');o.textContent=s;ss.appendChild(o);});
})();

function fmt(n){ return n.toLocaleString('en-US'); }
function pct(n){ return (n*100).toFixed(1)+'%'; }
function money(n){ return '$'+Math.round(n).toLocaleString('en-US'); }

/* ===== SVG chart helpers ===== */
function donut(segments, centerVal, centerLab, size){
  size=size||120; const r=size/2-12, cx=size/2, cy=size/2, C=2*Math.PI*r;
  let off=0, total=segments.reduce((s,x)=>s+x.v,0)||1, arcs='';
  segments.forEach(s=>{
    const frac=s.v/total, len=frac*C;
    arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="11" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
    off+=len;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef0f3" stroke-width="11"/>
    ${arcs}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">${centerVal}</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1" fill="var(--ink3)">${centerLab}</text>
  </svg>`;
}
function ring(pctVal, size){
  size=size||130; const r=size/2-13, cx=size/2, cy=size/2, C=2*Math.PI*r;
  const len=Math.min(1,pctVal)*C;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef0f3" stroke-width="12"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--orange)" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${len} ${C-len}" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy-1}" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink)">${Math.round(pctVal*100)}%</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1" fill="var(--ink3)">OF GOAL</text>
  </svg>`;
}
function sparkline(vals, w, h, color){
  w=w||120; h=h||30; color=color||'var(--green)';
  const max=Math.max(...vals), min=Math.min(...vals), rng=(max-min)||1;
  const pts=vals.map((v,i)=>[ (i/(vals.length-1))*w, h-3-((v-min)/rng)*(h-6) ]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L ${w} ${h} L 0 ${h} Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${area}" fill="${color}" opacity="0.08"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function trend(vals, period){
  // build a pseudo daily trend for a sparkline based on the period total
  const n=period==='today'||period==='yesterday'?8:(period==='week'||period==='lastweek'?7:14);
  const out=[]; for(let i=0;i<n;i++){ out.push(0.6+seed('t'+period+i)*0.8); }
  return out;
}

/* ===== team aggregation (both role streams) ===== */
function teamTotals(metrics){
  const t={calls:0,accounts:0,leads:0,creditsRan:0,b2bFail:0,
           accountsReceived:0,sales:0,installs:0,docusignSent:0,signed:0,firstPay:0,rmr:0,revenue:0,utilSum:0};
  metrics.forEach(m=>{
    t.calls+=m.calls; t.accounts+=m.accounts; t.leads+=m.leads; t.creditsRan+=m.creditsRan; t.b2bFail+=m.b2bFail;
    t.accountsReceived+=m.accountsReceived; t.sales+=m.sales; t.installs+=m.installs; t.docusignSent+=m.docusignSent;
    t.signed+=m.signed; t.firstPay+=m.firstPay; t.rmr+=m.rmr; t.revenue+=m.revenue; t.utilSum+=m.util;
  });
  t.conv=t.sales/Math.max(1,t.calls);            // blended call→sale
  t.leadConv=t.accounts/Math.max(1,t.calls);     // origination: call→account
  t.closeRate=t.sales/Math.max(1,t.accountsReceived); // closing: account→sale
  t.util=t.utilSum/Math.max(1,metrics.length);
  return t;
}

/* lead source breakdown for the active set/period */
function sourceMetrics(){
  const m=PERIOD_MULT[state.period]||1;
  const reps=activeReps();
  return SOURCES.map(src=>{
    let calls=0,sales=0;
    reps.forEach(r=>{
      const b=seed(r.name+src+state.period);
      const c=Math.round((6+b*16)*m*0.35);
      const s=Math.round(c*(0.16+seed(src+r.name)*0.24));
      calls+=c; sales+=s;
    });
    return {src, calls, sales, conv:sales/Math.max(1,calls)};
  }).filter(s=> !state.source || s.src===state.source);
}

/* ===== sort state for rep table ===== */
let sortKey='installs', sortDir=-1, tableSearch='';

function renderDash(){
  const metrics=allMetrics();
  const tt=teamTotals(metrics);
  const periodLab=PERIOD_LABEL[state.period];
  let html='';

  /* ---- 1. OVERALL PERFORMANCE (role-aware) ---- */
  const viewLab = state.view==='opener' ? 'Opened By — origination' : 'Closer — closing';
  html+=`<div class="section-h"><h2>Overall Performance</h2><span class="hint">${periodLab}${scopeLabel()} · <b style="color:var(--orange)">${viewLab}</b></span></div>`;
  if(state.view==='opener'){
    html+=`<div class="stat-row">
      ${statTile('Total Calls', fmt(tt.calls), spark(metrics,'calls'))}
      ${statTile('Accounts Created', fmt(tt.accounts), spark(metrics,'accounts'))}
      ${statTile('Call → Account', pct(tt.leadConv), '', tt.leadConv>=0.18?'up':'down', (tt.leadConv>=0.18?'▲':'▼')+' vs 18% target')}
      ${statTile('Leads Created', fmt(tt.leads), '')}
      ${statTile('Credits Ran', fmt(tt.creditsRan), spark(metrics,'creditsRan'))}
      ${statTile('Utilization', pct(tt.util), '', tt.util>=0.7?'up':'down', (tt.util>=0.7?'▲':'▼')+' vs 70% target')}
    </div>`;
  } else {
    html+=`<div class="stat-row">
      ${statTile('Accounts Received', fmt(tt.accountsReceived), spark(metrics,'accountsReceived'))}
      ${statTile('Sales Closed', fmt(tt.sales), spark(metrics,'sales'))}
      ${statTile('Account → Sale', pct(tt.closeRate), '', tt.closeRate>=0.65?'up':'down', (tt.closeRate>=0.65?'▲':'▼')+' close rate')}
      ${statTile('Installs', fmt(tt.installs), spark(metrics,'installs'))}
      ${statTile('First Payments', fmt(tt.firstPay), '')}
      ${statTile('RMR Sold', money(tt.rmr), '', '', money(tt.revenue)+' est. revenue', true)}
    </div>`;
  }

  /* ---- 2 + 3 row: Lead Source + Sales Funnel ---- */
  html+=`<div class="section-h"><h2>Lead Source &amp; Funnel</h2><span class="hint">Where production comes from, and where it converts</span></div>`;
  html+=`<div class="cols-2">${leadSourceCard()}${funnelCard(tt)}</div>`;

  /* ---- 4 + 5 row: Goal Tracking + Credit Activity ---- */
  html+=`<div class="section-h"><h2>Goals &amp; Credit</h2><span class="hint">Monthly pace and prospect qualification</span></div>`;
  html+=`<div class="cols-2">${goalCard(tt)}${creditCard(metrics,tt)}</div>`;

  /* ---- 6. REP TABLE ---- */
  html+=`<div class="section-h"><h2>Representative Performance</h2><span class="hint">Sortable · searchable · top performer highlighted</span></div>`;
  html+=repTableCard(metrics,tt);

  document.getElementById('dash').innerHTML=html;
  wireTable();
}

function scopeLabel(){
  const bits=[];
  if(state.rep) bits.push(state.rep);
  if(state.team) bits.push(state.team);
  if(state.office) bits.push(state.office);
  if(state.source) bits.push(state.source);
  return bits.length? ' · '+bits.join(' · ') : ' · All reps';
}
function statTile(label,val,sparkSvg,deltaCls,deltaTxt,accent){
  return `<div class="stat"><div class="sl">${label}</div><div class="sv${accent?' accent':''}">${val}</div>
    ${deltaTxt?`<div class="sd ${deltaCls||''}">${deltaTxt}</div>`:''}
    ${sparkSvg?`<div class="spark">${sparkSvg}</div>`:''}</div>`;
}
function spark(metrics,key){
  // sparkline of per-rep values as a quick distribution
  const vals=metrics.map(m=>m[key]); if(vals.length<2) vals.push(vals[0]||0,0);
  return sparkline(vals,120,30,'var(--orange)');
}

/* ---- lead source card ---- */
function leadSourceCard(){
  const rows=sourceMetrics();
  const maxCalls=Math.max(...rows.map(r=>r.calls),1);
  const dots=['#23ade8','#4b50ec','#1fb87f','#c98a16','#ec7b4b','#9a9da3'];
  let body=`<div class="ls-head"><span>Source</span><span>Calls</span><span>Sales</span><span>Conv %</span></div>`;
  rows.forEach((r,i)=>{
    body+=`<div class="ls-row">
      <div><div class="ls-name"><span class="ls-dot" style="background:${dots[i%dots.length]}"></span>${r.src}</div>
      <div class="ls-bar"><i style="width:${(r.calls/maxCalls*100).toFixed(0)}%;background:${dots[i%dots.length]}"></i></div></div>
      <div class="ls-val"><b>${fmt(r.calls)}</b></div>
      <div class="ls-val"><b>${fmt(r.sales)}</b></div>
      <div class="ls-val"><b>${pct(r.conv)}</b></div>
    </div>`;
  });
  return `<div class="card"><h3>Lead Source Performance</h3><div class="csub">Production by source — expands as sources are added</div>${body}</div>`;
}

/* ---- funnel card (spans both roles) ---- */
function funnelCard(tt){
  const calls=tt.calls, accounts=tt.accounts, sales=tt.sales;
  const c2a=accounts/Math.max(1,calls), c2s=sales/Math.max(1,calls), a2s=sales/Math.max(1,tt.accountsReceived);
  const stages=[
    {l:'Total Calls', sub:'Opened By', v:calls, c:'var(--orange)', w:100},
    {l:'Accounts Created', sub:'Opened By', v:accounts, c:'var(--blue)', w:Math.max(40,c2a*100)},
    {l:'Sales Closed', sub:'Closer', v:sales, c:'var(--green)', w:Math.max(28,c2s*100)},
  ];
  let bars='';
  stages.forEach(s=>{ bars+=`<div class="fn-stage"><div class="fn-bar" style="background:${s.c};width:${s.w}%"><span class="fl">${s.l} <span style="opacity:.7;font-size:10px">· ${s.sub}</span></span><span class="fv">${fmt(s.v)}</span></div></div>`; });
  return `<div class="card"><h3>Sales Funnel</h3><div class="csub">Origination feeds the top; the Closer owns the conversion to sale</div>
    <div class="funnel">${bars}</div>
    <div class="fn-conv"><span>Call→Account <b>${pct(c2a)}</b></span><span>Call→Sale <b>${pct(c2s)}</b></span><span>Account→Sale <b>${pct(a2s)}</b></span></div>
  </div>`;
}

/* ---- goal card ---- */
function goalCard(tt){
  const reps=activeReps().length;
  const goal=Math.max(30, Math.round(reps*32));   // goal set above current pace so % reads realistically
  const current=tt.installs;
  const remaining=Math.max(0,goal-current);
  const pctGoal=current/goal;
  const pending=Math.round(tt.accounts*0.18);
  const pace=Math.round(current*(30/Math.max(1,(new Date(2026,5,29)).getDate())));
  return `<div class="card"><h3>Monthly Goal Tracking</h3><div class="csub">Installs vs goal · pace to month end</div>
    <div class="goal-wrap">
      <div>${ring(pctGoal,140)}</div>
      <div class="goal-stats">
        <div class="goal-mini"><div class="gl">Current Installs</div><div class="gv accent">${fmt(current)}</div></div>
        <div class="goal-mini"><div class="gl">Install Goal</div><div class="gv">${fmt(goal)}</div></div>
        <div class="goal-mini"><div class="gl">Remaining</div><div class="gv">${fmt(remaining)}</div></div>
        <div class="goal-mini"><div class="gl">Pending Delivery</div><div class="gv">${fmt(pending)}</div></div>
        <div class="goal-mini"><div class="gl">Projected Pace</div><div class="gv green">${fmt(pace)}</div></div>
        <div class="goal-mini"><div class="gl">% of Goal</div><div class="gv">${Math.round(pctGoal*100)}%</div></div>
      </div>
    </div>
  </div>`;
}

/* ---- credit card ---- */
function creditCard(metrics,tt){
  const total=tt.creditsRan;
  const fails=tt.b2bFail;
  const failPct=fails/Math.max(1,total);
  // source split (mock): bureau distribution
  const segs=[
    {n:'Experian', v:Math.round(total*0.46), c:'#23ade8'},
    {n:'Equifax',  v:Math.round(total*0.34), c:'#4b50ec'},
    {n:'TransUnion',v:Math.round(total*0.20), c:'#1fb87f'},
  ];
  const dseg=segs.map(s=>({v:s.v,c:s.c}));
  let legend='<div class="legend">'+segs.map(s=>`<span><i style="background:${s.c}"></i>${s.n} ${fmt(s.v)}</span>`).join('')+'</div>';
  return `<div class="card"><h3>Credit Activity</h3><div class="csub">Prospect qualification &amp; lead quality</div>
    <div class="credit-grid">
      <div style="display:flex;align-items:center;justify-content:center">${donut(dseg,fmt(total),'PULLS',140)}</div>
      <div>
        <div class="cr-mini"><div class="cl">Credits Ran</div><div class="cv">${fmt(total)}</div></div>
        <div class="cr-mini"><div class="cl">Total Credit Pulls</div><div class="cv">${fmt(total)}</div></div>
        <div class="cr-mini"><div class="cl">B2B Failures</div><div class="cv" style="color:var(--red)">${fmt(fails)}</div></div>
        <div class="cr-mini"><div class="cl">Failure %</div><div class="cv" style="color:${failPct>0.15?'var(--red)':'var(--ink)'}">${pct(failPct)}</div></div>
      </div>
    </div>
    ${legend}
  </div>`;
}

/* ---- rep table: grouped origination (Opened By) vs closing (Closer) ---- */
function repTableCard(metrics,tt){
  const cols=[
    {k:'name', l:'Representative', num:false, grp:''},
    // origination — Opened By
    {k:'calls', l:'Calls', num:true, grp:'o'},
    {k:'accounts', l:'Accts Created', num:true, grp:'o'},
    {k:'leadConv', l:'Call→Acct', num:true, fmt:pct, grp:'o'},
    {k:'creditsRan', l:'Credits', num:true, grp:'o'},
    // closing — Closer
    {k:'accountsReceived', l:'Accts Recv', num:true, grp:'c'},
    {k:'sales', l:'Sales', num:true, grp:'c'},
    {k:'closeRate', l:'Acct→Sale', num:true, fmt:pct, grp:'c'},
    {k:'installs', l:'Installs', num:true, grp:'c'},
    {k:'rmr', l:'RMR', num:true, fmt:money, grp:'c'},
    {k:'revenue', l:'Revenue', num:true, fmt:money, grp:'c'},
  ];
  let rows=metrics.filter(m=>!tableSearch||m.name.toLowerCase().includes(tableSearch.toLowerCase()));
  rows=rows.slice().sort((a,b)=> (a[sortKey]<b[sortKey]?-1:a[sortKey]>b[sortKey]?1:0)*sortDir);
  const topVal=Math.max(...metrics.map(m=>m[sortKey]||0));

  // group header row
  const oCount=cols.filter(c=>c.grp==='o').length, cCount=cols.filter(c=>c.grp==='c').length;
  const groupHead=`<tr class="grp-row"><th></th>`
    +`<th class="grp grp-o" colspan="${oCount}">Origination — Opened By</th>`
    +`<th class="grp grp-c" colspan="${cCount}">Closing — Closer</th></tr>`;
  const thead=cols.map(c=>`<th class="${c.num?'num':''} ${c.k===sortKey?'sorted':''} ${c.grp==='o'?'col-o':c.grp==='c'?'col-c':''}" data-k="${c.k}">${c.l}<span class="ar">${c.k===sortKey?(sortDir<0?'▼':'▲'):'↕'}</span></th>`).join('');
  const body=rows.map(m=>{
    const isTop = (m[sortKey]===topVal) && sortKey!=='name' && rows.length>1;
    const tds=cols.map(c=>{
      const raw=m[c.k]; const val=c.fmt?c.fmt(raw):(c.num?fmt(raw):raw);
      const cls=(c.num?'num':'rep')+(c.grp==='o'?' col-o':c.grp==='c'?' col-c':'');
      return `<td class="${cls}">${val}</td>`;
    }).join('');
    return `<tr class="${isTop?'top':''}">${tds}</tr>`;
  }).join('');
  const foot=`<tr><td class="rep">Team Totals</td>`
    +`<td class="num col-o">${fmt(tt.calls)}</td><td class="num col-o">${fmt(tt.accounts)}</td><td class="num col-o">${pct(tt.leadConv)}</td><td class="num col-o">${fmt(tt.creditsRan)}</td>`
    +`<td class="num col-c">${fmt(tt.accountsReceived)}</td><td class="num col-c">${fmt(tt.sales)}</td><td class="num col-c">${pct(tt.closeRate)}</td><td class="num col-c">${fmt(tt.installs)}</td><td class="num col-c">${money(tt.rmr)}</td><td class="num col-c">${money(tt.revenue)}</td>`
    +`</tr>`;
  return `<div class="card">
    <div class="tbl-bar">
      <div><h3 style="display:inline">All Representatives</h3> <span class="csub" style="display:inline">${activeReps().length} reps · ${PERIOD_LABEL[state.period]} · origination follows the opener, closing follows the closer</span></div>
      <input class="tsearch" id="repSearch" placeholder="Search representative…" value="${tableSearch}">
    </div>
    <div style="overflow-x:auto"><table class="ktab" id="repTable">
      <thead>${groupHead}<tr>${thead}</tr></thead>
      <tbody>${body||'<tr><td colspan="11" style="color:var(--ink3);text-align:center;padding:20px">No representatives match the current filters.</td></tr>'}</tbody>
      <tfoot>${foot}</tfoot>
    </table></div>
  </div>`;
}
function wireTable(){
  document.querySelectorAll('#repTable th').forEach(th=>{
    th.addEventListener('click',()=>{
      const k=th.dataset.k;
      if(k===sortKey) sortDir*=-1; else { sortKey=k; sortDir=(k==='name'?1:-1); }
      renderDash();
    });
  });
  const s=document.getElementById('repSearch');
  if(s) s.addEventListener('input',e=>{ tableSearch=e.target.value; const pos=e.target.selectionStart; renderDash(); const ns=document.getElementById('repSearch'); if(ns){ns.focus(); ns.setSelectionRange(pos,pos);} });
}

/* ===== CSV export of the rep table ===== */
function exportCSV(){
  const metrics=allMetrics();
  const tt=teamTotals(metrics);
  const head=['Representative','Team','Office',
    'Calls (Opened By)','Accounts Created (Opened By)','Call-to-Account (Opened By)','Credits Ran (Opened By)',
    'Accounts Received (Closer)','Sales (Closer)','Account-to-Sale (Closer)','Installs (Closer)','RMR (Closer)','Revenue (Closer)','B2B Failures'];
  const lines=[head.join(',')];
  metrics.forEach(m=>lines.push([m.name,m.team,m.office,
    m.calls,m.accounts,(m.leadConv*100).toFixed(1)+'%',m.creditsRan,
    m.accountsReceived,m.sales,(m.closeRate*100).toFixed(1)+'%',m.installs,Math.round(m.rmr),Math.round(m.revenue),m.b2bFail].join(',')));
  lines.push(['Team Totals','','',
    tt.calls,tt.accounts,(tt.leadConv*100).toFixed(1)+'%',tt.creditsRan,
    tt.accountsReceived,tt.sales,(tt.closeRate*100).toFixed(1)+'%',tt.installs,Math.round(tt.rmr),Math.round(tt.revenue),tt.b2bFail].join(','));
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='KPI-Dashboard-'+state.period+'.csv'; a.click();
}
renderDash();
</script>
</body>
